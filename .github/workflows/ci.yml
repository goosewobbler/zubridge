name: CI

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_API: ${{ secrets.TURBO_API }}

jobs:
  # Decide which pipelines a PR needs. The releasekit standing PR (release/*) only carries version
  # bumps and changelogs for changes already CI'd on their feeder PRs, so the whole pipeline is
  # skipped for it; `CI Required` below still reports success. `[skip ci]` can't be used because a
  # squash merge would inherit it and suppress the publish workflow. Non-PR events run everything.
  detect-changes:
    name: Detect Changes
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    outputs:
      electron: ${{ steps.result.outputs.electron }}
      tauri: ${{ steps.result.outputs.tauri }}
      rust: ${{ steps.result.outputs.rust }}
    steps:
      - name: 🔎 Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            electron:
              - 'packages/electron/**'
              - 'apps/electron/**'
            tauri:
              - 'packages/tauri/**'
              - 'packages/tauri-plugin/**'
              - 'packages/core/**'
              - 'apps/tauri/**'
              - 'apps/tauri-v1/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            rust:
              - 'packages/core/**'
              - 'packages/tauri-plugin/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            libs:
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'packages/ui/**'
              - 'packages/apps-shared/**'
              - 'e2e/**'
              - 'scripts/**'
            infra:
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - 'tsconfig.base.json'

      - name: 🧮 Resolve pipelines
        id: result
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          ELECTRON: ${{ steps.filter.outputs.electron }}
          TAURI: ${{ steps.filter.outputs.tauri }}
          RUST: ${{ steps.filter.outputs.rust }}
          LIBS: ${{ steps.filter.outputs.libs }}
          INFRA: ${{ steps.filter.outputs.infra }}
        run: |
          electron=false
          tauri=false
          rust=false
          shared=false

          if [ "$IS_PR" != "true" ] || [ "$LIBS" = "true" ] || [ "$INFRA" = "true" ]; then shared=true; fi
          if [ "$shared" = "true" ] || [ "$ELECTRON" = "true" ]; then electron=true; fi
          if [ "$shared" = "true" ] || [ "$TAURI" = "true" ]; then tauri=true; fi
          if [ "$IS_PR" != "true" ] || [ "$INFRA" = "true" ] || [ "$RUST" = "true" ]; then rust=true; fi

          {
            echo "electron=$electron"
            echo "tauri=$tauri"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Build shared packages on Linux only
  build-shared-packages:
    name: Build Shared Packages
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Setup workspace
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: "24.x"

      - name: 🏗️ Build shared packages
        run: pnpm run build:packages

      - name: 📦 Upload shared packages
        uses: actions/upload-artifact@v7
        with:
          name: shared-packages
          path: |
            packages/*/dist
            packages/tauri-plugin
          retention-days: 1

  # Code quality checks - Ubuntu only (fast feedback)
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared-packages]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Setup workspace
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: "24.x"

      - name: 📦 Download shared packages
        uses: actions/download-artifact@v7
        with:
          name: shared-packages
          path: packages

      - name: 🔍 Run Linting
        run: pnpm run lint

      - name: 🎨 Check Formatting
        run: pnpm run format:check

      - name: ✅ Run Typecheck
        run: pnpm run typecheck

      - name: 📦 Check Publishability
        run: pnpm run check:publishable

      - name: 🧪 Run Unit Tests
        run: pnpm test:unit

  # Rust tests for zubridge-core across all feature combinations
  zubridge-core-rust-tests:
    name: zubridge-core (features=${{ matrix.features }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "uniffi"
          - "napi"
          - "tauri"
          - "uniffi,napi"
          - "uniffi,tauri"
          - "napi,tauri"
          - "uniffi,napi,tauri"
      fail-fast: false
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 🗄️ Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 🐧 Install Linux system dependencies (tauri feature)
        if: contains(matrix.features, 'tauri')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: 🏗️ Build zubridge-core (features=${{ matrix.features }})
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build -p zubridge-core
          else
            cargo build -p zubridge-core --features "${{ matrix.features }}"
          fi

      - name: 🧪 Test zubridge-core (features=${{ matrix.features }})
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test -p zubridge-core
          else
            cargo test -p zubridge-core --features "${{ matrix.features }}"
          fi

  # E2E + Package tests - Electron (all modes)
  electron-tests:
    needs: [detect-changes, build-shared-packages, code-quality]
    if: needs.detect-changes.outputs.electron == 'true'
    name: electron:${{ matrix.mode }}
    strategy:
      matrix:
        mode: [zustand-basic, zustand-handlers, zustand-reducers, redux, custom]
      fail-fast: false
    uses: ./.github/workflows/build-and-test.yml
    with:
      app: electron
      mode: ${{ matrix.mode }}
      package_test_only: false
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}

  # E2E + Package tests - Tauri v2 and v1 (basic mode only)
  tauri-tests:
    needs: [detect-changes, build-shared-packages, code-quality]
    if: needs.detect-changes.outputs.tauri == 'true'
    name: ${{ matrix.app }}:zustand-basic
    strategy:
      matrix:
        app: [tauri, tauri-v1]
      fail-fast: false
    uses: ./.github/workflows/build-and-test.yml
    with:
      app: ${{ matrix.app }}
      mode: zustand-basic
      package_test_only: false
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}

  # Package-only tests - Test minimal apps without E2E suite
  package-only-tests:
    needs: [detect-changes, build-shared-packages, code-quality]
    if: needs.detect-changes.outputs.electron == 'true'
    name: electron:sandbox-true
    uses: ./.github/workflows/build-and-test.yml
    with:
      app: electron
      mode: sandbox-true
      package_test_only: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}

  # Single required check for the branch ruleset. Skipped jobs (nothing affected, or the
  # standing PR) count as passing; only a failed or cancelled job fails it.
  ci-required:
    name: CI Required
    needs:
      - detect-changes
      - build-shared-packages
      - code-quality
      - zubridge-core-rust-tests
      - electron-tests
      - tauri-tests
      - package-only-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not pass"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped"
